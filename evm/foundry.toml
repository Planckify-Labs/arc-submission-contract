[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
# Pinned rather than left to the solc default, which drifts between releases and would
# silently change deployed bytecode. Cancun is the highest version supported by every
# chain we target: Arc's baseline is Osaka (a superset), Arbitrum is on Prague.
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arbitrum = "${RPC_URL}"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"
base_sepolia = "https://sepolia.base.org"
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
# arcscan is a Blockscout instance, not Etherscan — it ignores the API key.
arc = { key = "unused", chain = 5042, url = "https://explorer.arc.io/api" }
arc_testnet = { key = "unused", chain = 5042002, url = "https://testnet.arcscan.app/api" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
# monadvision / socialscan is a Blockscout-compatible verifier; no key needed.
monad = { key = "unused", chain = 143, url = "https://monadvision.com/api" }
monad_testnet = { key = "unused", chain = 10143, url = "https://testnet.monadvision.com/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
